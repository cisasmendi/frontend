# Archivo nginx.conf
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    
      # Agregar el tipo MIME correcto para archivos .mjs
    types {
        application/javascript js mjs;
    }

    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Configuración para archivos estáticos
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf)$ {
            # Cachear archivos estáticos por 15 dias
            expires 15d;
            add_header Cache-Control "public, no-transform";
            try_files $uri $uri/ /index.html;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            #proxy_pass http://paginaeco_backend:3000;
            proxy_pass http://paginaeco-backend-svc:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Opcional: configurar manejo de errores
        error_page 404 /index.html;


    }
}